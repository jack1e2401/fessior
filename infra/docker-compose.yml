services:
  mysql:
    image: mysql:8.0
    container_name: ocj_mysql
    restart: always
    ports:
      - "3307:3306"
    networks: [app]
    env_file:
      - path: ../.env
    environment:
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocj_redis
    restart: always
    ports:
      - "6379:6379"
    networks: [app]
    env_file:
      - path: ../.env
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  judge0-db:
    image: postgres:13.0
    container_name: ocj_judge0_db
    restart: always
    networks: [judge0]
    env_file:
      - path: ./judge0/judge0.env.example
    environment:
      POSTGRES_HOST: judge0-db
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data/

  judge0-redis:
    image: redis:6.0
    container_name: ocj_judge0_redis
    restart: always
    networks: [judge0]
    env_file:
      - path: ./judge0/judge0.env.example
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    volumes:
      - judge0_redis_data:/data

  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: ocj_judge0_server
    restart: always
    privileged: true
    networks: [judge0]
    env_file:
      - path: ./judge0/judge0.env.example
    environment:
      POSTGRES_HOST: judge0-db
      REDIS_HOST: judge0-redis
    volumes:
      - ./judge0/judge0.env.example:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started

  judge0-workers:
    image: judge0/judge0:1.13.0
    container_name: ocj_judge0_workers
    restart: always
    networks: [judge0]
    privileged: true
    command: ["./scripts/workers"]
    env_file:
      - path: ./judge0/judge0.env.example
    environment:
      POSTGRES_HOST: judge0-db
      REDIS_HOST: judge0-redis
    volumes:
      - ./judge0/judge0.env.example:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started

  judge0-local-proxy:
    image: node:22-alpine
    profiles: [hybrid]
    restart: unless-stopped
    command:
      - node
      - -e
      - "const net=require('node:net');net.createServer(client=>{const upstream=net.connect(2358,'judge0-server');client.pipe(upstream).pipe(client);upstream.on('error',()=>client.destroy());client.on('error',()=>upstream.destroy())}).listen(2358,'0.0.0.0')"
    ports:
      - "127.0.0.1:2358:2358"
    networks: [judge0, judge0-debug]
    depends_on:
      judge0-server:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    container_name: ocj_frontend
    restart: always
    ports:
      - "5173:5173"
    networks: [app]
    environment:
      VITE_API_URL: http://localhost:6868/api/v1
      VITE_SOCKET_URL: http://localhost:6868
    volumes:
      - ..:/app
      - web_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: ocj_backend
    restart: always
    ports:
      - "6868:6868"
    networks: [app, judge0]
    env_file:
      - path: ../.env
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JUDGE0_URL: http://judge0-server:2358
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      judge0-server:
        condition: service_started

  judge:
    build:
      context: ..
      dockerfile: apps/judge/Dockerfile
    container_name: ocj_judge
    restart: always
    networks: [app, judge0]
    env_file:
      - path: ../.env
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JUDGE0_URL: http://judge0-server:2358
    depends_on:
      redis:
        condition: service_started
      judge0-server:
        condition: service_started

networks:
  app:
  judge0:
    internal: true
  judge0-debug:

volumes:
  mysql_data:
  redis_data:
  judge0_postgres_data:
  judge0_redis_data:
  web_node_modules:
